version: "3.9"

networks:
  storefront-net:
    driver: bridge

volumes:
  mongo-user-data:
  mongo-product-data:
  mongo-cart-data:
  mongo-order-data:

services:
  # ---------------------------------------------------------------------
  # Databases - one MongoDB instance per service (database-per-service)
  # ---------------------------------------------------------------------
  mongo-user:
    image: mongo:7
    container_name: storefront-mongo-user
    restart: unless-stopped
    volumes:
      - mongo-user-data:/data/db
    networks:
      - storefront-net

  mongo-product:
    image: mongo:7
    container_name: storefront-mongo-product
    restart: unless-stopped
    volumes:
      - mongo-product-data:/data/db
    networks:
      - storefront-net

  mongo-cart:
    image: mongo:7
    container_name: storefront-mongo-cart
    restart: unless-stopped
    volumes:
      - mongo-cart-data:/data/db
    networks:
      - storefront-net

  mongo-order:
    image: mongo:7
    container_name: storefront-mongo-order
    restart: unless-stopped
    volumes:
      - mongo-order-data:/data/db
    networks:
      - storefront-net

  # ---------------------------------------------------------------------
  # Microservices
  # ---------------------------------------------------------------------
  user-service:
    build: ./services/user-service
    container_name: storefront-user-service
    restart: unless-stopped
    environment:
      PORT: 4001
      MONGO_URI: mongodb://mongo-user:27017/userdb
      JWT_SECRET: ${JWT_SECRET:-dev_super_secret_change_me}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
    depends_on:
      - mongo-user
    ports:
      - "4001:4001"
    networks:
      - storefront-net

  product-service:
    build: ./services/product-service
    container_name: storefront-product-service
    restart: unless-stopped
    environment:
      PORT: 4002
      MONGO_URI: mongodb://mongo-product:27017/productdb
    depends_on:
      - mongo-product
    ports:
      - "4002:4002"
    networks:
      - storefront-net

  cart-service:
    build: ./services/cart-service
    container_name: storefront-cart-service
    restart: unless-stopped
    environment:
      PORT: 4003
      MONGO_URI: mongodb://mongo-cart:27017/cartdb
      JWT_SECRET: ${JWT_SECRET:-dev_super_secret_change_me}
      PRODUCT_SERVICE_URL: http://product-service:4002
    depends_on:
      - mongo-cart
      - product-service
    ports:
      - "4003:4003"
    networks:
      - storefront-net

  order-service:
    build: ./services/order-service
    container_name: storefront-order-service
    restart: unless-stopped
    environment:
      PORT: 4004
      MONGO_URI: mongodb://mongo-order:27017/orderdb
      JWT_SECRET: ${JWT_SECRET:-dev_super_secret_change_me}
      CART_SERVICE_URL: http://cart-service:4003
      PRODUCT_SERVICE_URL: http://product-service:4002
    depends_on:
      - mongo-order
      - cart-service
      - product-service
    ports:
      - "4004:4004"
    networks:
      - storefront-net

  api-gateway:
    build: ./api-gateway
    container_name: storefront-api-gateway
    restart: unless-stopped
    environment:
      PORT: 4000
      USER_SERVICE_URL: http://user-service:4001
      PRODUCT_SERVICE_URL: http://product-service:4002
      CART_SERVICE_URL: http://cart-service:4003
      ORDER_SERVICE_URL: http://order-service:4004
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
    depends_on:
      - user-service
      - product-service
      - cart-service
      - order-service
    ports:
      - "4000:4000"
    networks:
      - storefront-net

  # ---------------------------------------------------------------------
  # Frontend
  # ---------------------------------------------------------------------
  frontend:
    build: ./frontend
    container_name: storefront-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:4000}
    depends_on:
      - api-gateway
    ports:
      - "5173:5173"
    networks:
      - storefront-net
